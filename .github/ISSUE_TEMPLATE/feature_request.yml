name: Feature request
description: Suggest an improvement that fits the scope of Energy Control Kit Fix
title: "[Feature]: "
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like added or changed?
      description: Describe the feature or improvement you are requesting.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the current limitation, inconvenience, or use case behind the request.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Why does this fit this project's scope?
      description: Energy Control Kit Fix is intentionally narrow, so explain how the request relates to the existing Energy Control fix.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. If you have an idea for how this could work, describe it here.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked existing issues for the same request.
          required: true
